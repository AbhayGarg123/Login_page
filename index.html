<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section id="form">
            <div class="image_container">
                <img 
                    src="image.png"
                    alt="Washing Machine">
            </div>
            <div class="Sign_In_form">

                <div class="form_content">
                    <h1>Hello Again!</h1>
                    <p class="welcome">
                        Welcome back! we missed you!
                    </p>
                    <form>
                        <div class="input_group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                placeholder="Emailid@site.com">
                        </div>
                        <div class="input_group">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                placeholder="Password">
                            <a href="#" class="forgot">
                                Forgot Password
                            </a>
                        </div>
                        <button type="submit">
                            Login
                        </button>
                    </form>
                    <p class="register">
                        Not a member?
                        <a href="#">Register Now</a>
                    </p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
